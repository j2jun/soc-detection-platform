name: Detection tests

# Runs Sigma rules against recorded attack logs. Nothing is stored in the repo:
# the tools and datasets are downloaded fresh on GitHub's runner each time.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CHAINSAW_VERSION: v2.17.1

jobs:
  hunt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Chainsaw, SigmaHQ rules, and attack samples
        run: |
          curl -sSL "https://github.com/WithSecureLabs/chainsaw/releases/download/${CHAINSAW_VERSION}/chainsaw_x86_64-unknown-linux-gnu.tar.gz" | tar xz
          curl -sSLo mapping.yml "https://raw.githubusercontent.com/WithSecureLabs/chainsaw/${CHAINSAW_VERSION}/mappings/sigma-event-logs-all.yml"
          git clone -q --depth 1 https://github.com/SigmaHQ/sigma.git
          git clone -q --depth 1 https://github.com/sbousseaden/EVTX-ATTACK-SAMPLES.git samples
          find . -maxdepth 2 -name chainsaw -type f

      - name: Hunt with my rules
        run: ./chainsaw/chainsaw hunt samples -s rules --mapping mapping.yml --json -o custom.json --skip-errors

      - name: Hunt with SigmaHQ community rules
        run: ./chainsaw/chainsaw hunt samples -s sigma/rules/windows --mapping mapping.yml --json -o sigma.json --skip-errors

      - name: Self-check the coverage script
        run: python3 test_coverage.py

      - name: ATT&CK coverage report (fails if a custom rule never fires)
        run: |
          set -o pipefail
          { echo "## ATT&CK coverage"; python3 attack_coverage.py custom.json sigma.json rules; } | tee -a "$GITHUB_STEP_SUMMARY"

  # Linux rules can't be tested on recorded Windows logs, so this job records its own:
  # it simulates the Binance pyenv-shim swap under auditd and checks each rule in rules/linux/
  # fires on the attack but not on real pyenv activity.
  linux-sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install auditd, pyenv, and sigma-cli
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq auditd
          git clone -q --depth 1 https://github.com/pyenv/pyenv.git ~/.pyenv
          pip install -q sigma-cli==4.0.0 pySigma==2.0.2 pysigma-backend-sqlite==2.1.1

      - name: Simulate benign pyenv activity, then the shim-swap attack
        run: bash .github/simulate-pyenv-attack.sh

      - name: Convert Linux rules to SQL
        run: |
          sigma convert -t sqlite --without-pipeline rules/linux/ | tee linux.sql

      - name: Self-check the hunt script
        run: python3 linux_hunt.py --test

      - name: Hunt (fails on a missed attack or a false positive)
        run: |
          set -o pipefail
          { echo "## Linux attack simulation"; python3 linux_hunt.py legit.log attack.log linux.sql; } | tee -a "$GITHUB_STEP_SUMMARY"
