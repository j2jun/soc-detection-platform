title: Pyenv Shim Modified by Unexpected Process
id: be9abf3e-048c-4abf-b09a-3e92541276a0
status: experimental
description: |
  Detects a write to a pyenv shim by a process other than the ones pyenv itself uses. Shims run every time a
  developer types `python`, so replacing one gives persistent code execution. This is the
  foothold in the 2026 Binance heist: a fake take-home assignment swapped a pyenv component
  on an engineer's laptop.
  Requires the audit rule `-w <home>/.pyenv/shims -p wa -k pyenv_shim`.
  The filter uses `exe` (the binary's real path, set by the kernel), not `comm`, which any
  process can rename (CI checks that a renamed `cp` still alerts).
  Known gap: `pyenv rehash` writes shims through bash, cp, chmod, and rm (measured in CI), so
  malware that calls those real binaries is missed. Pair this with a file-integrity
  check that compares each shim to pyenv's prototype.
references:
  - https://www.bleepingcomputer.com/news/security/binance-says-fake-job-interview-led-to-63-billion-crypto-heist/
  - https://attack.mitre.org/techniques/T1554/
author: j2jun
date: 2026-11-05
tags:
  - attack.persistence
  - attack.t1554
  - attack.execution
  - attack.t1574
logsource:
  product: linux
  service: auditd
detection:
  selection:
    type: SYSCALL
    key: pyenv_shim
  filter_pyenv:  # every binary `pyenv rehash` used in the CI simulation
    exe:
      - /usr/bin/bash
      - /usr/bin/cp
      - /usr/bin/chmod
      - /usr/bin/rm
  condition: selection and not filter_pyenv
falsepositives:
  - Other tools that manage pyenv shims, e.g. pyenv plugins written in another language (rare)
level: medium
