title: Pyenv Shim Modified by Unexpected Process
id: be9abf3e-048c-4abf-b09a-3e92541276a0
status: experimental
description: |
  Detects a write to a pyenv shim by a process other than the ones pyenv itself uses. Shims run every time a
  developer types `python`, so replacing one gives persistent code execution. This is the
  foothold in the 2026 Binance heist: a fake take-home assignment swapped a pyenv component
  on an engineer's laptop.
  Requires the audit rule `-w <home>/.pyenv/shims -p wa -k pyenv_shim`.
  `pyenv rehash` writes shims through bash, cp, chmod, and rm (measured in CI). Each filter
  requires BOTH the real binary (`exe`, set by the kernel; `comm` is spoofable) AND a pyenv
  command line (`proctitle`, merged in from the event's PROCTITLE record), so a plain bash
  script or a renamed binary still alerts (both are CI cases).
  Known gap: the command line is argv, which an attacker can forge (e.g. passing the
  pyenv-rehash path as a dummy argument). Closing that needs process ancestry or a
  file-integrity check comparing each shim to pyenv's prototype.
references:
  - https://www.bleepingcomputer.com/news/security/binance-says-fake-job-interview-led-to-63-billion-crypto-heist/
  - https://attack.mitre.org/techniques/T1554/
author: j2jun
date: 2026-11-05
tags:
  - attack.persistence
  - attack.t1554
  - attack.execution
  - attack.t1574
logsource:
  product: linux
  service: auditd
detection:
  selection:
    type: SYSCALL
    key: pyenv_shim
  filter_pyenv_rehash:  # the rehash script itself (runs as `bash .../libexec/pyenv-rehash`)
    exe: /usr/bin/bash
    proctitle|contains: /.pyenv/libexec/pyenv-rehash
  filter_pyenv_prototype:  # rehash copies/chmods/removes its prototypes (.pyenv-shim, .pyenv-source-shim)
    exe:
      - /usr/bin/cp
      - /usr/bin/chmod
      - /usr/bin/rm
    proctitle|contains: /shims/.pyenv-
  condition: selection and not 1 of filter_pyenv_*
falsepositives:
  - Other tools that manage pyenv shims, e.g. pyenv plugins written in another language (rare)
level: medium
