title: Windows Event Log Cleared
id: 5fd6ac96-c849-4ce9-a785-478c4c80a97d
status: experimental
description: |
  Detects the Security (Event ID 1102) or System (Event ID 104) event log being
  cleared. Attackers clear logs to hide their tracks after running tools like Mimikatz.
references:
  - https://attack.mitre.org/techniques/T1070/001/
author: j2jun
date: 2026-11-04
tags:
  - attack.defense-evasion
  - attack.t1070.001
# No `service:` on purpose. Both events are written by the Microsoft-Windows-Eventlog
# provider, but Chainsaw ties `service: security` to Microsoft-Windows-Security-Auditing,
# so a service-scoped rule silently never matches. Filtering on Channel works everywhere.
logsource:
  product: windows
detection:
  cleared_security:
    Channel: Security
    EventID: 1102
  cleared_system:
    Channel: System
    EventID: 104
  condition: 1 of cleared_*
falsepositives:
  - An administrator clearing the log on purpose (confirm with the change ticket)
level: high
